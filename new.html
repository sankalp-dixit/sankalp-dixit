<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Height Transition Example</title>
  <style>
    .box {
      width: 200px;
      height: 50px;
      background: lightblue;
      transition: height 10s; 
    }

    .box:hover {
      height: 500px; 
    }
  </style>
</head>
<body>
  <div class="box"></div>
</body>
</html>
